services:
  devops-mcp:
    image: 'ghcr.io/u2giants/devops-mcp:main'
    pull_policy: always
    restart: always
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rw
      - mcp-audit:/audit
    environment:
      - PORT=8765
      - HOST_ROOT=/host
      - AUDIT_LOG_PATH=/audit/mcp-audit.log
      - 'TOKEN_CLAUDE=${TOKEN_CLAUDE}'
      - 'TOKEN_GEMINI=${TOKEN_GEMINI}'
      - 'TOKEN_CHATGPT=${TOKEN_CHATGPT}'
      - 'TOKEN_CODEX=${TOKEN_CODEX}'

volumes:
  mcp-audit: null
